<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZomBoard — Knox County</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111712">
  <meta name="description" content="ZomBoard, the McCoy safehouse mission board. Nine jobs, questionable odds, one safehouse.">
  <meta property="og:title" content="ZomBoard | Knox County">
  <meta property="og:description" content="Nine jobs. One safehouse. Pick a mission, don't get bitten.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/hero-mccoy.svg">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="missions.js" defer></script>
</head>
<body>
  <div class="site-frame">
    <header class="site-header wrapper">
      <a class="brand" href="./" aria-label="ZomBoard home">
        <span class="brand-mark" aria-hidden="true">Z<span>✳</span></span>
        <span class="brand-name"><strong>ZomBoard</strong><small>PROJECT ZOMBOID · MISSION BOARD</small></span>
      </a>
    </header>

    <main>
      <section class="mission-section wrapper" id="missions" aria-labelledby="missions-title">
        <h1 id="missions-title" class="sr-only">Missions</h1>
        <div id="mission-grid" class="mission-grid" aria-live="polite"></div>

        <div class="board-footer"><span>✳ ALL INFORMATION SUBJECT TO UNDEAD INTERFERENCE</span><span id="display-count">09 ASSIGNMENTS</span></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrapper footer-inner"><span class="footer-icon">M✳</span><div><strong>McCOY LOGGING CO.</strong><span>IF YOU CAN READ THIS, YOU'RE STILL ALIVE.</span></div><div class="footer-right">THIS IS HOW YOU DIED. <small>A SURVIVOR-MADE PROJECT ZOMBOID MISSION BOARD.</small></div></div>
    </footer>
  </div>

  <dialog id="mission-dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner">
      <button id="dialog-close" class="dialog-close" type="button" aria-label="Close mission briefing">✕ <span>CLOSE</span></button>
      <div id="dialog-content"></div>
    </div>
  </dialog>
</body>
</html>

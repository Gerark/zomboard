<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZomBoard — Knox County</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111712">
  <meta name="description" content="ZomBoard, the safehouse mission board. Supply runs, safehouse projects, and questionable odds.">
  <meta property="og:title" content="ZomBoard | Knox County">
  <meta property="og:description" content="ZomBoard, the safehouse mission board. Supply runs, safehouse projects, and questionable odds.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/hero-mccoy.svg">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- MISSION_SHARE_CONFIG -->
  <script src="missions-data.js" defer></script>
  <script src="missions.js" defer></script>
</head>
<body>
  <div class="site-frame">
    <header class="site-header wrapper">
      <a class="brand" href="./" aria-label="ZomBoard home">
        <span class="brand-mark" aria-hidden="true">Z<span>✳</span></span>
        <span class="brand-name"><strong>ZomBoard</strong><small>PROJECT ZOMBOID · MISSION BOARD</small></span>
      </a>
    </header>

    <main>
      <section class="mission-section wrapper" id="missions" aria-labelledby="missions-title">
        <h1 id="missions-title" class="sr-only">Missions</h1>
        <div class="mission-layout">
          <aside class="mission-sidebar" aria-labelledby="quest-list-title">
            <h2 id="quest-list-title">QUEST LIST</h2>
            <ol id="mission-list" class="mission-list"></ol>
            <section id="completed-quest-list-section" class="completed-quest-list-section" aria-labelledby="completed-quest-list-title" hidden>
              <h3 id="completed-quest-list-title">COMPLETED QUESTS</h3>
              <ol id="completed-mission-list" class="mission-list"></ol>
            </section>
          </aside>
          <div class="mission-boards">
            <div id="mission-grid" class="mission-grid" aria-live="polite"></div>
            <section id="completed-missions-section" class="completed-missions-section" aria-labelledby="completed-missions-title" hidden>
              <h2 id="completed-missions-title" class="mission-group-title">COMPLETED QUESTS</h2>
              <div id="completed-mission-grid" class="mission-grid" aria-live="polite"></div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="mission-dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner">
      <button id="dialog-close" class="dialog-close" type="button" aria-label="Close mission briefing">✕ <span>CLOSE</span></button>
      <div id="dialog-content"></div>
    </div>
  </dialog>
</body>
</html>

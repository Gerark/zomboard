<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="title desc">
  <title id="title">A proper goodbye</title>
  <desc id="desc">A wooden marker bearing Seb's name, a fresh grave and a shovel inside the safehouse fence.</desc>

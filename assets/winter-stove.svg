<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Winter is coming</title>
  <desc id="desc">A cast-iron stove, stacked logs and a simple bed in a small timber room, with winter outside the window.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#58604c"/><stop offset="1" stop-color="#303e31"/>
    </linearGradient>
    <linearGradient id="wood" x2="1" y2=".3">
      <stop stop-color="#755e4a"/><stop offset=".53" stop-color="#493e31"/><stop offset="1" stop-color="#252821"/>
    </linearGradient>
    <linearGradient id="metal" x2="0" y2="1">
      <stop stop-color="#687269"/><stop offset=".5" stop-color="#3f4c47"/><stop offset="1" stop-color="#202c28"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#8b9b92"/><stop offset="1" stop-color="#4f6b63"/>
    </linearGradient>
    <radialGradient id="warmth">
      <stop stop-color="#cf9369" stop-opacity=".42"/><stop offset="1" stop-color="#cf9369" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette">
      <stop offset=".55" stop-color="#081310" stop-opacity="0"/><stop offset="1" stop-color="#081310" stop-opacity=".76"/>
    </radialGradient>
    <filter id="grit">
      <feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="3" seed="14" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".19"/></feComponentTransfer>
    </filter>
